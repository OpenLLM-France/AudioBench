global:
  batch_size: 25
  overwrite: False
  number_of_samples: 250
  skip_errors: False
  gpu_memory_utilization: 0.4
  device: cuda
  compute_metrics: false
  skip_inference: false
  min_audio_duration: 1
  max_audio_duration: 120
  output_folder: results

  datasets:
    # ASR
    - group: asr
      metrics: wer
      task: asr
      number_of_samples: 500   # ASR has no judge (cheap to score) and long-form sets
                               # (YouTubeFr, SUMM-RE, TEDx) lose precision at 250
      min_audio_duration: 1
      max_audio_duration: 30
      datasets:
        - group: asr_fr
          language: fr
          datasets:
            - name: Fleurs
              path: <DATA_FOLDER>/nemo/asr/fr/context/FLEURS/test.jsonl
            - name: CommonVoice
              path: <DATA_FOLDER>/nemo/asr/fr/context/CommonVoice/test.jsonl
            - name: Multilingual_TEDx
              path: <DATA_FOLDER>/nemo/asr/fr/context/Multilingual_TEDx/test.jsonl
            - name: VoxPopuli
              path: <DATA_FOLDER>/nemo/asr/fr/context/VoxPopuli/test.jsonl
            - name: SUMM-RE
              path: <DATA_FOLDER>/nemo/asr/fr/context/SUMM-RE/test.jsonl
              min_audio_duration: 2
            - name: YouTubeFr
              path: <DATA_FOLDER>/nemo/asr/fr/context/YouTubeFr/test_split6.jsonl

        - group: asr_en
          language: en
          datasets:
            - name: Fleurs
              path: <DATA_FOLDER>/nemo/asr/en/context/FLEURS/test.jsonl
            - name: CommonVoice
              path: <DATA_FOLDER>/nemo/asr/en/context/CommonVoice/test.jsonl
            - name: VoxPopuli
              path: <DATA_FOLDER>/nemo/asr/en/context/VoxPopuli/test.jsonl

        - group: asr_it
          language: it
          datasets:
            - name: Fleurs
              path: <DATA_FOLDER>/nemo/asr/it/context/FLEURS/test.jsonl
            - name: Multilingual_TEDx
              path: <DATA_FOLDER>/nemo/asr/it/context/Multilingual_TEDx/test.jsonl

        - group: asr_de
          language: de
          datasets:
            - name: Fleurs
              path: <DATA_FOLDER>/nemo/asr/de/context/FLEURS/test.jsonl
            - name: Multilingual_TEDx
              path: <DATA_FOLDER>/nemo/asr/de/context/Multilingual_TEDx/test.jsonl

        - group: asr_nl
          language: nl
          datasets:
            - name: Fleurs
              path: <DATA_FOLDER>/nemo/asr/nl/context/FLEURS/test.jsonl

        - group: asr_es
          language: es
          datasets:
            - name: Fleurs
              path: <DATA_FOLDER>/nemo/asr/es/context/FLEURS/test.jsonl
            - name: Multilingual_TEDx
              path: <DATA_FOLDER>/nemo/asr/es/context/Multilingual_TEDx/test.jsonl

        - group: asr_pt
          language: pt
          datasets:
            - name: Fleurs
              path: <DATA_FOLDER>/nemo/asr/pt/context/FLEURS/test.jsonl
            - name: Multilingual_TEDx
              path: <DATA_FOLDER>/nemo/asr/pt/context/Multilingual_TEDx/test.jsonl
        - group: asr_ar
          language: ar
          datasets:
            - name: Fleurs
              path: <DATA_FOLDER>/nemo/asr/ar/context/FLEURS/test.jsonl
            - name: Multilingual_TEDx
              path: <DATA_FOLDER>/nemo/asr/ar/context/Multilingual_TEDx/test.jsonl

    # AST
    - group: ast
      metrics: [bleu, meteor]
      task: ast
      min_audio_duration: 1
      max_audio_duration: 30
      datasets:
        - name: Multilingual_TEDx
          path: <DATA_FOLDER>/nemo/ast/fr-en/context/Multilingual_TEDx/test.jsonl
          language: fr-en
        - name: Multilingual_TEDx
          path: <DATA_FOLDER>/nemo/ast/fr-es/context/Multilingual_TEDx/test.jsonl
          language: fr-es
        - name: Multilingual_TEDx
          path: <DATA_FOLDER>/nemo/ast/es-fr/context/Multilingual_TEDx/test.jsonl
          language: es-fr
        - name: Multilingual_TEDx
          path: <DATA_FOLDER>/nemo/ast/es-it/context/Multilingual_TEDx/test.jsonl
          language: es-it

    # Temporal
    - group: temporal_regex
      metrics: [temporal_regex]
      task: Temporal
      language: en
      datasets:
        - name: SLUE-SQA5_time2word
          sub_task: time2word
          path: <DATA_FOLDER>/nemo/misc/en/context/slue-phase-2-sqa5/time2word/verified_test_pure.jsonl
          prompt_prefix: Answer with only the word (e.g. "Mid-Atlantic"). Plain word, no sentence, no quotes, no extra words.
        - name: SLUE-SQA5_word2time
          sub_task: word2time
          path: <DATA_FOLDER>/nemo/misc/en/context/slue-phase-2-sqa5/word2time/verified_test_pure.jsonl
          prompt_prefix: 'Give only the timestamp (or a list of timestamps if many) in seconds. No sentence, no quotes, no extra words. Format like: 12.1s if one occurence or 12.1s,13.2s if many occurences or 19.3s-23.6s if start and end are asked or "invalid_timestamp" if not found.'

    - group: format_follwing
      metrics: format_check
      task: Format Following
      language: en
      datasets:
        - name: SLUE-SQA5_format_json_answer
          path: <DATA_FOLDER>/nemo/misc/en/context/slue-phase-2-sqa5/format_json_answer/verified_test.jsonl

    # Math Question Answering
    - group: math_qa
      metrics: acc
      task: Math Question Answering
      language: en
      datasets:
        - name: spoken-mqa_short_digit
    
    # Spoken Question Answering
    - group: sqa
      metrics: flow_judge
      task: Question Answering
      sub_task: QA
      datasets:
        - group: sqa_fr
          language: fr
          datasets:
            - name: VoxPopuli-QA
              path: <DATA_FOLDER>/nemo/question-answering/qa_audio-context-text-question/fr/VoxPopuli-QA/test.jsonl
            - name: CohereLabs-Aya_collection
              path: <DATA_FOLDER>/nemo/question-answering/qa_audio-question-only/fr/CohereLabs--aya_collection/test.jsonl
            # - name: ComparIA
            #   path: <DATA_FOLDER>/nemo/question-answering/qa_audio-question-only/fr/ComparIA/test.jsonl
            - name: Vigogne--Alpaca
              path: <DATA_FOLDER>/nemo/question-answering/qa_audio-question-only/fr/Vigogne--Alpaca/test.jsonl

        - group: sqa_en
          language: en
          datasets:
            - name: slue_p2_sqa5_test
            - name: public_sg_speech_qa_test
            - name: alpaca_audio_test       # synthetic
            - name: openhermes_audio_test   # synthetic
            # - name: VoxPopuli-QA
            #   path: <DATA_FOLDER>/nemo/question-answering/qa_audio-context-text-question/en/VoxPopuli-QA/test.jsonl
            - name: NationalSpeechCorpus_SQA
              path: <DATA_FOLDER>/nemo/misc/en/context/AudioLLMs--Multitask-National-Speech-Corpus-v1-extend/SQA/test.jsonl
            - name: fisher_AIR-Bench
              path: <DATA_FOLDER>/nemo/misc/en/context/AIR_bench/Chat/speech/fisher/test.jsonl
            - name: SpokenWOZ_AIR-Bench
              path: <DATA_FOLDER>/nemo/misc/en/context/AIR_bench/Chat/speech/spokenwoz/test.jsonl

    # Dialogue Summarization
    - group: dialogue_summarization
      metrics: flow_judge
      task: Dialogue Summarization
      language: en
      datasets:
        - name: NationalSpeechCorpus_SDS
          path: <DATA_FOLDER>/nemo/misc/en/context/AudioLLMs--Multitask-National-Speech-Corpus-v1-extend/SDS/test.jsonl
    
    # Audio Question Answering
    - group: audio_qa
      metrics: flow_judge
      task: Audio Question Answering
      language: en
      datasets:
        - name: clotho_aqa_test
        - name: wavcaps_qa_test
        - name: audiocaps_qa_test

    # Audio Captioning
    - group: audio_captioning
      metrics: flow_judge
      task: Audio Captioning
      language: other
      datasets:
        - name: wavcaps_test
        - name: audiocaps_test

    # Emotion Recognition
    - group: emotion_recognition
      metrics: label_match
      task: Emotion Recognition
      sub_task: Emotion
      datasets:
        - group: emotion_recognition_fr
          language: fr
          datasets:
            - name: MELD_Emotion
              path: <DATA_FOLDER>/nemo/misc/fr/context/MELD/EmotionDS/test.jsonl

        - group: emotion_recognition_en
          language: en
          datasets:
            - name: iemocap_emotion_test
            - name: MELD_Emotion
              path: <DATA_FOLDER>/nemo/misc/en/context/MELD/EmotionDS/test.jsonl

    # Gender Recognition
    - group: gender_recognition
      metrics: label_match
      task: Gender Recognition
      datasets:
        - group: gender_recognition_fr
          language: fr
          datasets:
            - name: CommonVoice_Gender
              path: <DATA_FOLDER>/nemo/misc/fr/context/CommonVoice_spk_attributes_reco/CommonVoice-gender-recognition/test_balanced.jsonl

        - group: gender_recognition_en
          language: en
          datasets:
            - name: iemocap_gender_test
            - name: CommonVoice_Gender
              path: <DATA_FOLDER>/nemo/misc/en/context/CommonVoice_spk_attributes_reco/CommonVoice-gender-recognition/test_balanced.jsonl

    # Age Recognition
    - group: age_recognition
      metrics: label_match
      task: Age Recognition
      datasets:
        - group: age_recognition_fr
          language: fr
          datasets:
            - name: CommonVoice_Age
              path: <DATA_FOLDER>/nemo/misc/fr/context/CommonVoice_spk_attributes_reco/CommonVoice-age-recognition/test.jsonl

        - group: age_recognition_en
          language: en
          datasets:
            - name: CommonVoice_Age
              path: <DATA_FOLDER>/nemo/misc/en/context/CommonVoice_spk_attributes_reco/CommonVoice-age-recognition/test.jsonl

    # Music Question Answering
    - group: music_qa
      metrics: flow_judge
      task: Music Question Answering
      datasets:
        - group: music_qa_en
          language: en
          datasets:
            - name: muchomusic_test   # various type of questions (mcq)
            - name: MTJ-Jamendo_AIR-Bench  # various type of questions (mcq)
              path: <DATA_FOLDER>/nemo/misc/en/context/AIR_bench/Foundation/music/MTJ-Jamendo/test.jsonl
              judge_binary: true
            - name: MusicCaps-QA
              path: <DATA_FOLDER>/nemo/music/music-question-answering/en/MusicCaps/test.jsonl
        - group: music_qa_fr
          language: fr
          datasets:
            - name: MusicCaps-QA
              path: <DATA_FOLDER>/nemo/music/music-question-answering/fr/MusicCaps/test.jsonl

    # Music Captioning
    - group: music_captioning
      metrics: flow_judge
      task: Music Captioning
      language: other
      datasets:
        - name: MusicCaps
          path: <DATA_FOLDER>/nemo/music/music-captioning/en/context/MusicCaps/test.jsonl

    # Spoken Language Identification
    - group: language_identification
      metrics: label_match
      task: Spoken Language Identification
      language: other
      datasets:
        - name: CoVost2_AIR-Bench
          path: <DATA_FOLDER>/nemo/misc/en/context/AIR_bench/Foundation/speech/covost2/test.jsonl

    - group: diarization
      metrics: flow_judge
      task: Diarization
      language: en
      datasets:
        - name: AMI
          path: <DATA_FOLDER>/nemo/diarization/en/ami/timestamps/test.jsonl

    # - group: speaker_id
    #   metrics: label_match
    #   task: Speaker Identification
    #   language: other
    #   datasets:
    #     - name: VoxCeleb
    #       path: <DATA_FOLDER>/nemo/misc/multilang/context/VoxCeleb/yes_no/test.jsonl

models:
  - id: qwen2_omni_3b
  - id: qwen2_omni_7b
  - id: qwen2_audio_7b_instruct
    batch_size: 20
  - id: phi_4_multimodal_instruct
    batch_size: 20
  - id: voxtral_mini_3b_2507
  # - id: audio_flamingo_3        # need very recent vLLM (and so transformers)
  #   batch_size: 25
  # - id: salmonn_7b              # transformers only - very slow
  #   batch_size: 1
  # - id: kimi_audio_7b_instruct  # transformers only - very slow
  #   batch_size: 1