# What the results report / leaderboard shows. Read by
# audio_bench/visualization/build_leaderboard.py (and the plot_radar /
# plot_category_bars figures, which reuse its loader).

# Datasets unchecked by default in the report's dataset filter (they can still
# be ticked back in the browser), and left out of the static figures.
# --show_all_datasets bypasses this list.
ignored_datasets:
  - MuChoMusic
  # Information Extraction
  - SLUE-SQA5_time2word
  - SLUE-SQA5_word2time

# (task, language) pairs excluded from a task's AVERAGE (still shown as their
# own column). Arabic ASR is dropped from the ASR average.
avg_excluded_task_langs:
  - [ASR, AR]

# Model size shown in the tables (regex on the model name -> size).
model_sizes:
  - ['^OpenLLM-France/Luciole-8B-Audio', 8.8B]
  - ['^OpenLLM-France/Luciole-1B-Audio', 1.9B]
  - ['^microsoft/Phi-4-multimodal-instruct$', 5.6B]
  - ['^nvidia/audio-flamingo-3-hf$', 8.2B]
  - ['^Qwen/Qwen2-Audio-7B-Instruct$', 8.4B]
  - ['^Qwen/Qwen2\.5-Omni-7B$', 11B]
  - ['^Qwen/Qwen2\.5-Omni-3B$', 5.9B]
  - ['^Qwen/Qwen3-Omni-30B-A3B-Instruct$', 35.3B]
  - ['^mistralai/Voxtral-Mini-3B-2507$', 4.68B]
  - ['^mistralai/Voxtral-Small-24B-2507$', 24.3B]
  - ['^google/gemma-4-E2B-it$', 5.1B]
