# Builds the leaderboard (leaderboard/index.html) from leaderboard/results and
# leaderboard/config.yaml, and deploys the leaderboard/ folder to GitHub Pages.
# Requires Settings > Pages > Source = "GitHub Actions".
name: Leaderboard

on:
  push:
    branches: [main]
    paths:
      - "leaderboard/**"
      - "audio_bench/visualization/**"
      - ".github/workflows/leaderboard.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy plotly pyyaml
      - name: Build leaderboard
        run: |
          python -m audio_bench.visualization.build_leaderboard leaderboard/results \
            --config leaderboard/config.yaml --output_folder leaderboard
          test -f leaderboard/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: leaderboard

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
